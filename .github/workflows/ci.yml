name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./e2e/smoke.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python/marrow-anthropic[test]"
      - run: python -m pytest python/marrow-anthropic
      - run: python -m pip install build && python -m build python/marrow-anthropic

  windows:
    # The Rust is portable but nothing proved it until this job existed. Build and test on a real
    # Windows runner rather than trusting that the cfg gates are right.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - run: cargo test --workspace
      # The Windows release ships the semantic build, so prove it compiles here rather than
      # discovering it during a release. ONNX Runtime arrives through fastembed.
      - run: cargo build -p marrow-cli -p marrow-mcp --features embed-fastembed

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
