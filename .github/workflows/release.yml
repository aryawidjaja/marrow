name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./e2e/smoke.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python -c 'import os,tomllib; files=("crates/marrow-cli/Cargo.toml","python/marrow-anthropic/pyproject.toml"); versions={tomllib.load(open(f,"rb"))["package" if f.endswith("Cargo.toml") else "project"]["version"] for f in files}; tag=os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert versions == {tag}, f"tag {tag} does not match package versions {versions}"'
      - run: python -m pip install -e "python/marrow-anthropic[test]" build
      - run: python -m pytest python/marrow-anthropic
      - run: python -m build python/marrow-anthropic

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: embed-fastembed
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }} --bin marrow --bin marrow-mcp --bin marrow-serve --bin marrow-server
      - name: Package
        shell: bash
        run: |
          dist="marrow-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dist"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          for bin in marrow marrow-mcp marrow-serve marrow-server; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$dist"/
          done
          cp README.md llms.txt LICENSE LICENSE-APACHE COMMERCIAL.md SECURITY.md "$dist"/
          cp -R assets "$dist"/
          tar czf "$dist.tar.gz" "$dist"
          if command -v sha256sum >/dev/null; then
            sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
          else
            shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"
          fi
          if [ -n "$ext" ]; then
            7z a -tzip "$dist.zip" "$dist" > /dev/null
            sha256sum "$dist.zip" > "$dist.zip.sha256"
          fi
      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          generate_release_notes: true

  # One installable bundle for clients that will not build from source. Runs
  # after `build` so it can reuse the very binaries that were just released,
  # rather than compiling them a second time and risking a different artifact.
  mcpb:
    needs: build
    runs-on: macos-latest   # lipo, for the universal macOS binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.tar.gz'
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            tar xzf "marrow-${tag}-${target}.tar.gz"
            mkdir -p "bins/${target}"
            cp "marrow-${tag}-${target}/marrow-mcp" "bins/${target}/marrow-mcp"
          done
          win=x86_64-pc-windows-msvc
          tar xzf "marrow-${tag}-${win}.tar.gz"
          mkdir -p "bins/${win}"
          cp "marrow-${tag}-${win}/marrow-mcp.exe" "bins/${win}/marrow-mcp.exe"
          cp "marrow-${tag}-${win}/"*.dll "bins/${win}/" 2>/dev/null || true
      - name: Build the bundle
        run: ./scripts/build-mcpb.sh "${GITHUB_REF_NAME}" bins
      - name: Verify it starts and lists tools
        run: |
          mkdir -p /tmp/verify/proj && cd /tmp/verify
          unzip -oq "$GITHUB_WORKSPACE/dist/mcpb/marrow-mcp.mcpb"
          chmod +x server/marrow-mcp-darwin
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./server/marrow-mcp-darwin --root ./proj > out.jsonl
          grep -q '"name":"mem_recall"' out.jsonl || { echo "bundle did not list tools"; cat out.jsonl; exit 1; }
      - name: Upload the bundle for the Windows check
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/mcpb/marrow-mcp.mcpb
      - name: Attest the bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/mcpb/marrow-mcp.mcpb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mcpb/marrow-mcp.mcpb
            dist/mcpb/marrow-mcp.mcpb.sha256
      - name: server.json for the MCP registry
        run: |
          echo "Publish with: mcp-publisher login github && mcp-publisher publish" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat server.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: server-json
          path: server.json

  # Auto-bump the Homebrew tap formula to the new tag (no manual SHA editing).
  # Requires a repo secret HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents: Read+Write
  # on aryawidjaja/homebrew-marrow.
  scoop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset="marrow-${tag}-x86_64-pc-windows-msvc.zip"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern "$asset"
          hash="$(sha256sum "$asset" | cut -d' ' -f1)"
          cat > marrow.json <<JSON
          {
            "version": "$version",
            "description": "Shared memory for parallel AI coding agents. Local, free, with rooms and file claims.",
            "homepage": "https://www.marrow.works",
            "license": "AGPL-3.0-only",
            "architecture": {
              "64bit": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$tag/$asset",
                "hash": "$hash"
              }
            },
            "extract_dir": "marrow-$tag-x86_64-pc-windows-msvc",
            "bin": ["marrow.exe", "marrow-mcp.exe", "marrow-serve.exe", "marrow-server.exe"],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/v\$version/marrow-v\$version-x86_64-pc-windows-msvc.zip"
                }
              },
              "extract_dir": "marrow-v\$version-x86_64-pc-windows-msvc"
            }
          }
          JSON
          python3 -c "import json;json.load(open('marrow.json'))"
          gh release upload "$tag" marrow.json --repo "${{ github.repository }}" --clobber

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute source tarball sha256
        id: src
        run: |
          tag="${GITHUB_REF_NAME}"
          sha=$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz" | sha256sum | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: aryawidjaja/homebrew-marrow
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Bump and push the formula
        run: |
          tag="${GITHUB_REF_NAME}"; ver="${{ steps.src.outputs.version }}"
          for f in Formula/marrow.rb Formula/marrow-semantic.rb; do
            sed -i -E "s#archive/refs/tags/v[0-9.]+\.tar\.gz#archive/refs/tags/${tag}.tar.gz#" "$f"
            sed -i -E "s#sha256 \"[0-9a-f]{64}\"#sha256 \"${{ steps.src.outputs.sha }}\"#" "$f"
            sed -i -E "s#assert_match \"marrow [0-9.]+\"#assert_match \"marrow ${ver}\"#" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/marrow.rb Formula/marrow-semantic.rb
          git diff --cached --quiet || git commit -m "marrow ${ver}"
          git push

  python-package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build python/marrow-anthropic
      - name: Attest Python packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "python/marrow-anthropic/dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: python/marrow-anthropic/dist/*

  mcpb-windows:
    needs: mcpb
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle
      - name: Start it and list tools
        shell: bash
        run: |
          mkdir -p verify/proj && cd verify
          unzip -oq ../marrow-mcp.mcpb
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./server/marrow-mcp-win32.exe --root ./proj > out.jsonl
          grep -q '"name":"mem_recall"' out.jsonl || { echo "windows bundle did not list tools"; cat out.jsonl; exit 1; }
