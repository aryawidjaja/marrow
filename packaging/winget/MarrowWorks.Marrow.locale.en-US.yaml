ShortDescription: Shared memory for parallel AI coding agents.
Description: Marrow gives every AI coding agent on your machine one brain to write to. Memory survives the end of a session, recall returns linked neighbours rather than only exact matches, and live sessions coordinate through rooms and file claims so two agents never edit the same file at once. It runs locally, stores everything in plain files, and speaks the Model Context Protocol so it works under Claude Code, Codex and Cursor.
